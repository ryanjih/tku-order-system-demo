{% extends "base.html" %}
{% block body %}
<h1 class="page-title">商品資料 <span class="text-muted fs-6">product</span></h1>
<div class="card"><table class="table table-hover mb-0">
<thead><tr><th>商品編號</th><th>名稱</th><th>分類</th><th class="text-end">單價</th><th class="text-end">庫存</th></tr></thead>
<tbody>{% for r in rows %}<tr>
  <td><code>{{ r['product_id'] }}</code></td><td>{{ r['name'] }}</td><td>{{ r['category'] }}</td>
  <td class="text-end">{{ '{:,.0f}'.format(r['unit_price']) }}</td>
  <td class="text-end">{{ r['stock'] }}</td></tr>{% endfor %}</tbody>
</table></div>
<p class="text-muted small mt-2">單價異動不會影響已成立訂單 — 明細已保存下單當時的價格。</p>
{% endblock %}
